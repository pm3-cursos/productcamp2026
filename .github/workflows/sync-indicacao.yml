# Sincroniza a planilha de pedidos (Google Sheets) com o D1 da plataforma de
# indicação. Roda a cada 6 h e quando o painel /indicacao/pm3/ pede
# (workflow_dispatch, via GITHUB_SYNC_TOKEN). Ver indicacao/LEIA-ME.md.
name: sync-indicacao

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      origem:
        description: 'Quem pediu (o painel preenche com o e-mail do admin)'
        required: false
        default: 'manual'

# Nunca duas sincronizações ao mesmo tempo; a mais nova espera a anterior.
concurrency:
  group: sync-indicacao
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ler a planilha e gravar o snapshot no D1
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          SHEET_TAB: ${{ secrets.SHEET_TAB }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE: pcamp-indicacao
          SYNC_ORIGEM: ${{ github.event_name == 'schedule' && 'cron' || inputs.origem }}
        run: node sync/index.mjs --remote
